{% load i18n static %}

<!-- Global Organization JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Rissala",
  "url": "{{ request.scheme }}://{{ request.get_host }}/",
  "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'img/iconRissala.png' %}",
  "description": "{% trans 'Découvrez Rissala, la plateforme de référence pour l\'apprentissage de la langue arabe et la transmission authentique du savoir islamique.' %}"
}
</script>

<!-- Global WebSite JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Rissala",
  "alternateName": ["Rissala.net", "Institut Rissala"],
  "url": "{{ request.scheme }}://{{ request.get_host }}/",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ request.scheme }}://{{ request.get_host }}/recherche/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- Specific Page JSON-LD Block -->
{% block structured_data %}
{% endblock %}
