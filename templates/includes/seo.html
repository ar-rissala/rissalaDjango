{% load i18n static %}

<!-- Canonical -->
{% block canonical %}
<link rel="canonical" href="{{ request.build_absolute_uri }}">
{% endblock %}

<!-- Hreflang (dynamically loops over LANGUAGES from settings if we set it in context processor, but for now we'll do standard ones based on what's available) -->
{% block hreflang %}
{% get_available_languages as LANGUAGES %}
{% for lang_code, lang_name in LANGUAGES %}
    <link rel="alternate" hreflang="{{ lang_code }}" href="{{ request.scheme }}://{{ request.get_host }}/{{ lang_code }}{{ request.path|slice:"3:" }}">
{% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ request.scheme }}://{{ request.get_host }}/fr{{ request.path|slice:"3:" }}">
{% endblock %}

<!-- Meta Tags -->
<meta name="description" content="{% block meta_description %}{% trans 'Rissala est une plateforme dédiée à l\'étude et à la transmission du savoir islamique.' %}{% endblock %}">
<meta name="robots" content="{% block robots %}index, follow, max-image-preview:large{% endblock %}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:title" content="{% block og_title %}{{ self.title|default:'Rissala' }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{% trans 'Rissala est une plateforme dédiée à l\'étude et à la transmission du savoir islamique.' %}{% endblock %}">
<meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'img/hero-bg.jpg' %}{% endblock %}">
<meta property="og:site_name" content="Rissala">
<meta property="og:locale" content="{{ request.LANGUAGE_CODE }}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ request.build_absolute_uri }}">
<meta name="twitter:title" content="{% block twitter_title %}{{ self.title|default:'Rissala' }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{% trans 'Rissala est une plateforme dédiée à l\'étude et à la transmission du savoir islamique.' %}{% endblock %}">
<meta name="twitter:image" content="{% block twitter_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'img/hero-bg.jpg' %}{% endblock %}">
