{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-background">
    <div class="max-w-md w-full space-y-8 bg-background-alt p-8 sm:p-10 rounded-2xl border border-white/10 shadow-xl">
        <div>
            <h2 class="mt-2 text-center text-3xl font-bold font-heading tracking-tight text-foreground">
                {% trans "Créer un compte" %}
            </h2>
            <p class="mt-2 text-center text-sm text-muted">
                {% trans "Rejoignez la plateforme Rissala" %}
            </p>
        </div>
        <form class="mt-8 space-y-6" method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div>
                <button type="submit" class="group relative flex w-full justify-center rounded-xl border border-transparent bg-primary px-4 py-3 text-sm font-medium text-background hover:bg-primary-light focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all">
                    {% trans "S'inscrire" %}
                </button>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-sm text-muted">
                    {% trans "Déjà un compte ?" %} 
                    <a href="{% url 'accounts:login' %}" class="font-medium text-primary hover:text-primary-light transition-colors">
                        {% trans "Se connecter" %}
                    </a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
